<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>Side Projects</title>

<link rel="icon" type="image/x-icon" href="favicon.ico">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#f15304;
  color:white;
  font-family:Arial,sans-serif;
  overflow-x:hidden;
  line-height:1.7;
}

/* FADE */
body::before,
body::after{
  content:"";
  position:fixed;
  left:0;
  width:100%;
  height:120px;
  pointer-events:none;
  z-index:10;
}

body::before{
  top:0;
  background:linear-gradient(#c24a00, transparent);
}

body::after{
  bottom:0;
  background:linear-gradient(transparent, #c24a00);
}

/* WRAP */
.wrap{
  max-width:1550px;
  margin:auto;
  padding:90px 70px 140px;
}

/* BACK */
.back{
  display:inline-block;
  color:white;
  text-decoration:none;
  font-size:20px;
  margin-bottom:36px;
  opacity:0.85;
}

.back:hover{
  opacity:1;
}

/* TITLE */
h1{
  font-size:88px;
  font-style:italic;
  line-height:1;
  margin-bottom:22px;
}

.hero-subtitle{
  font-size:42px;
  font-weight:400;
  line-height:1.35;
  max-width:1200px;
  margin-bottom:55px;
  opacity:0.96;
}

p{
  font-size:24px;
  max-width:920px;
}

/* MOBILE */
@media(max-width:1100px){

h1{
  font-size:58px;
}

.hero-subtitle{
  font-size:28px;
}

p{
  font-size:21px;
}

}

</style>
</head>

<body>

<div class="wrap">

<a class="back" href="index.html">← Back to Portfolio</a>

<h1>Side Projects</h1>

<div class="hero-subtitle">
Things I build purely for fun.
</div>

<p>
You found the party! Projects are on their way, so check back soon :)
</p>

</div>

</body>
</html>
